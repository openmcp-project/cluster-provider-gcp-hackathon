  labels:
    openmcp.cloud/cluster: platform
  name: providerconfigs.gcp.cluster.open-control-plane.io
spec:
  group: gcp.cluster.open-control-plane.io
  names:
    kind: ProviderConfig
    listKind: ProviderConfigList
    plural: providerconfigs
    singular: providerconfig
    shortNames:
    - gcpcfg
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
