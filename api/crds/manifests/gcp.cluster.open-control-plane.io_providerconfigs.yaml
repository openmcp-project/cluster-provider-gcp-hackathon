    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ProviderConfig is the Schema for the GCP cluster provider configuration.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ProviderConfig
            properties:
              providerRef:
                description: ProviderRef is a reference to the ClusterProvider resource this configuration belongs to.
                properties:
                  name:
                    type: string
                required:
                - name
