                    format: int32
                    minimum: 0
                    type: integer
                  machineType:
                    description: MachineType is the GCP machine type for the default node pool.
                    type: string
                  diskSizeGB:
                    description: DiskSizeGB is the disk size in GB for each node.
                    format: int32
                    minimum: 10
                    type: integer
                  network:
                    description: Network is the VPC network name or self-link.
                    type: string
                  subnetwork:
                    description: Subnetwork is the VPC subnetwork name or self-link.
